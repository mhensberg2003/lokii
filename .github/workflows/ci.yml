name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # tauri::generate_context! needs the built frontend.
      - run: pnpm build
      - run: scripts/fetch-libmpv.sh ${{ matrix.platform }}
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      # Windows test executables load libmpv-2.dll from PATH.
      - run: PATH="$PWD/libmpv/windows:$PATH" cargo test
        working-directory: src-tauri
